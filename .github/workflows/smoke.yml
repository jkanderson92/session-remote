name: Emulator smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build
        run: gradle :app:assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app on emulator and capture crash log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.sessionremote.app/.MainActivity
            sleep 15
            adb logcat -d > logcat.txt || true
            echo "===== CRASH LINES ====="
            grep -A 40 -E "FATAL EXCEPTION|AndroidRuntime" logcat.txt | head -120 || true
            echo "===== APP PROCESS ====="
            adb shell pidof com.sessionremote.app && echo "APP STILL RUNNING" || echo "APP NOT RUNNING"
            adb shell screencap -p /sdcard/shot.png
            adb pull /sdcard/shot.png shot.png || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: |
            logcat.txt
            shot.png
